version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: weather-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: weather-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-weather_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-weather_pass}
      POSTGRES_DB: ${DB_NAME:-weather_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./worker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  api:
    build: ./api
    container_name: weather-api
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  worker:
    build: ./worker
    container_name: weather-worker
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: weather-frontend
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
